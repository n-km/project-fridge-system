# Nur die Datenbank für die lokale Entwicklung:
#   docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pfs
      POSTGRES_PASSWORD: pfs
      POSTGRES_DB: pfs
    ports:
      - "5432:5432"
    volumes:
      - db-dev:/var/lib/postgresql/data

volumes:
  db-dev:
